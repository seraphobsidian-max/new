<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121324" />
      <stop offset="100%" stop-color="#080811" />
    </radialGradient>
    
    <!-- Neon Blue to Purple Gradient -->
    <linearGradient id="neoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="100" fill="url(#bgGlow)" />

  <!-- Outer Cyber Circle -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="url(#neoGrad)" stroke-width="6" stroke-dasharray="15 10" opacity="0.6" />

  <!-- Futuristic "N" Symbol -->
  <g filter="url(#glow)">
    <path d="M 170 340 L 170 160 L 230 160 L 330 340 L 330 160" 
          fill="none" 
          stroke="url(#neoGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Cyber Dots/Accents -->
  <circle cx="170" cy="160" r="8" fill="#3B82F6" />
  <circle cx="330" cy="340" r="8" fill="#EC4899" />
</svg>
